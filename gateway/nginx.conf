worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent rid=$request_id rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=edge_rate:10m rate=10r/s;
    limit_req_status 429;

    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # DNS embedded của Docker. Dùng biến trong proxy_pass để nginx RE-RESOLVE
    # hostname theo chu kỳ, tránh cache IP cũ khi container backend/frontend bị
    # tạo lại (nếu không sẽ 502 sau mỗi lần rebuild).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        client_max_body_size 512k;

        location /api/ {
            limit_req zone=edge_rate burst=20 nodelay;

            proxy_set_header X-Request-ID $request_id_final;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Mặc định nginx là 60s. Đo được thật (2026-09-20): /api/v1/chat gọi
            # 2 lượt Ollama tuần tự (trích ý định + diễn giải) trên CPU máy dev,
            # tổng round-trip 77s — vượt 60s mặc định, nginx trả 504 dù backend
            # vẫn đang xử lý bình thường.
            #
            # 150s (nâng từ 120s ở Phase 16.2): /narration/audio cộng dồn LLM
            # sinh văn bản (tới ~90s ở ca xấu) VÀ tổng hợp giọng nói VieNeu-TTS
            # (thêm ~15-20s) trong CÙNG một request — không tách hai request để
            # tránh gọi LLM hai lần cho cùng một lượt (xem docstring
            # `get_poi_narration_audio`). Không ảnh hưởng các endpoint khác
            # (chúng trả trong vài trăm ms).
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;

            set $backend_target backend:8000;
            proxy_pass http://$backend_target;
        }

        # Săn địa danh: ảnh chụp tại chỗ gửi lên dạng base64 trong JSON. Trình
        # duyệt đã thu ảnh về ≤ 1280 px (thường 150-500 KB, base64 thêm 1/3) —
        # vượt trần 512k chung của server. Chỉ nới cho ĐÚNG endpoint này; mọi
        # endpoint khác vẫn giữ trần nhỏ.
        location ~ ^/api/v1/explore/[^/]+/discover$ {
            client_max_body_size 12m;
            limit_req zone=edge_rate burst=20 nodelay;

            proxy_set_header X-Request-ID $request_id_final;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Model thị giác trên CPU: tới ~100s (explore_vision_timeout_seconds).
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;

            set $backend_explore backend:8000;
            proxy_pass http://$backend_explore;
        }

        location /health {
            limit_req zone=edge_rate burst=20 nodelay;
            proxy_set_header X-Request-ID $request_id_final;
            set $backend_health backend:8000;
            proxy_pass http://$backend_health;
        }

        location / {
            proxy_set_header X-Request-ID $request_id_final;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            set $frontend_target frontend:3000;
            proxy_pass http://$frontend_target;
        }
    }
}
